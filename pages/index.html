<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Notes — Tutorial 4</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
<main>
    <p class="eyebrow">WEB DEVELOPMENT FOUNDATIONS · TUTORIAL 4</p>
    <h1>My notes</h1>
    <p>Create a note, send it to the API, and see the response here.</p>

    <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form">
            <fieldset id="note-fields">
                <legend>Note details</legend>
                <label for="title">Title (required)</label>
                <input id="title" name="title" required maxlength="100"
                       aria-describedby="title-hint title-error">
                <small id="title-hint">Up to 100 characters.</small>
                <p id="title-error" class="error"></p>

                <label for="content">Content</label>
                <textarea id="content" name="content" rows="4" maxlength="1000"
                          aria-describedby="content-hint content-error"></textarea>
                <small id="content-hint">Optional. Up to 1,000 characters.</small>
                <p id="content-error" class="error"></p>

                <button id="submit-button" type="submit">Create note</button>
            </fieldset>
        </form>
        <p id="form-status" role="status" aria-live="polite"></p>
        <noscript>This form requires JavaScript. You can try the API at /docs.</noscript>
    </section>

    <section aria-labelledby="notes-heading">
        <div class="section-heading">
            <h2 id="notes-heading">Saved notes</h2>
            <button id="refresh-button" type="button">Refresh notes</button>
        </div>
        <p id="list-status" role="status" aria-live="polite"></p>
        <ul id="notes-list"></ul>
    </section>
    <footer>Notes are held in memory and disappear when the server restarts.</footer>
</main>
</body>
</html>
